name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.0.0)"
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  build-pi-image:
    name: Build and release image
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@main
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget parted dosfstools e2fsprogs zip

      - name: Download ALARM rootfs (aarch64)
        run: |
          wget -q http://os.archlinuxarm.org/os/ArchLinuxARM-rpi-aarch64-latest.tar.gz

      - name: Prepare rootfs extraction dir
        run: |
          sudo mkdir -p rootfs
          sudo tar -xpf ArchLinuxARM-rpi-aarch64-latest.tar.gz -C rootfs --numeric-owner
          sudo chown root:root rootfs
          rm -f ArchLinuxARM-rpi-aarch64-latest.tar.gz

      - name: Copy custom files into rootfs
        run: |
          sudo cp -r --remove-destination ./src/. rootfs/
          sudo cp -r ./android-auto/. rootfs/root/android-auto/

      - name: Calculate image size
        id: imgsize
        run: |
          ROOTFS_KB=$(sudo du -sk rootfs | cut -f1)
          # rootfs size + 512MB boot partition + 6144MB headroom
          IMG_MB=$(( (ROOTFS_KB / 1024) + 512 + 6144 ))
          echo "img_mb=${IMG_MB}" >> "$GITHUB_OUTPUT"

      - name: Create image file
        run: |
          IMG_NAME="nowa-${{ inputs.version }}-arm64.img"
          truncate -s "${{ steps.imgsize.outputs.img_mb }}M" "$IMG_NAME"

          parted -s "$IMG_NAME" mklabel msdos
          parted -s "$IMG_NAME" mkpart primary fat32 1MiB 513MiB
          parted -s "$IMG_NAME" mkpart primary ext4 513MiB 100%

          echo "IMG_NAME=$IMG_NAME" >> $GITHUB_ENV

      - name: Attach loop device
        run: |
          LOOPDEV=$(sudo losetup --show -fP "$IMG_NAME")
          echo "LOOPDEV=$LOOPDEV" >> $GITHUB_ENV

      - name: Format partitions
        run: |
          sudo mkfs.vfat -F32 "${LOOPDEV}p1"
          sudo mkfs.ext4 -F "${LOOPDEV}p2"

      - name: Fix fstab to use boot partition UUID
        run: |
          BOOT_UUID=$(sudo blkid -s UUID -o value "${LOOPDEV}p1")
          echo "Boot partition UUID: $BOOT_UUID"
          sudo sed -i "s#^/dev/mmcblk0p1.*#UUID=${BOOT_UUID}  /boot  vfat  defaults  0  0#" rootfs/etc/fstab
          cat rootfs/etc/fstab

      - name: Mount boot partition and seed it with stock boot files
        run: |
          # Mount the empty FAT partition to a temp location first
          mkdir -p boot_seed
          sudo mount "${LOOPDEV}p1" boot_seed
          # Copy the tarball's original /boot contents onto the real FAT partition
          sudo cp -a rootfs/boot/. boot_seed/
          sudo umount boot_seed
          # Now mount it into rootfs/boot for the chroot, now correctly pre-populated
          sudo mount --bind rootfs rootfs
          sudo mount "${LOOPDEV}p1" rootfs/boot

      - name: Bind-mount pseudo-filesystems for chroot
        run: |
          sudo mount --bind /proc rootfs/proc
          sudo mount --bind /dev rootfs/dev
          sudo mount --bind /dev/pts rootfs/dev/pts
          sudo mount --bind /sys rootfs/sys

      - name: Run chroot package installation
        run: |
          sudo cp chroot-run.sh rootfs/root/chroot-run.sh
          sudo chroot rootfs /root/chroot-run.sh
          sudo rm -f rootfs/root/chroot-run.sh

      - name: Unmount pseudo-filesystems
        if: always()
        run: |
          sudo umount -R rootfs/boot 2>/dev/null || true
          sudo umount -R rootfs/dev/pts 2>/dev/null || true
          sudo umount -R rootfs/dev 2>/dev/null || true
          sudo umount -R rootfs/proc 2>/dev/null || true
          sudo umount -R rootfs/sys 2>/dev/null || true
          sudo umount rootfs 2>/dev/null || true

      - name: Copy rootfs into root partition
        run: |
          mkdir -p mnt/root
          sudo mount "${LOOPDEV}p2" mnt/root
          sudo mkdir -p mnt/root/boot
          sudo mount "${LOOPDEV}p1" mnt/root/boot
          sudo cp -a rootfs/. mnt/root/

      - name: Unmount partitions
        run: |
          sudo umount mnt/root/boot || true
          sudo umount mnt/root

      - name: Detach loop device
        run: sudo losetup -d "$LOOPDEV"

      - name: Compress image
        run: xz -T0 -9 "$IMG_NAME"

      - name: Release arm64 image
        uses: softprops/action-gh-release@master
        with:
          tag_name: ${{ format('v{0}', inputs.version) }}
          name: ${{ format('v{0}', inputs.version) }}
          overwrite_files: true
          files: |
            ${{ env.IMG_NAME }}.xz
